# The whole Allocator: PostgreSQL, the API and the web app (http://localhost:8080).
# Reads secrets from .env (copy .env.example). SMARTTT and the Generator run
# separately: GENERATOR_BASE_URL must be the Generator's address as seen from
# this server, never localhost. In production put an HTTPS proxy in front of
# `web` (COOKIE_SECURE=true needs HTTPS) and back up the db-data volume.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: allocator
      POSTGRES_USER: allocator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allocator -d allocator"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://allocator:${POSTGRES_PASSWORD}@db:5432/allocator
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8000
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
